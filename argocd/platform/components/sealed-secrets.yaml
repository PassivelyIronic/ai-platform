# SealedSecrets — pierwszy komponent, bo od niego zależą wszystkie sekrety
# tenantów. Bez działającego kontrolera SealedSecret jest tylko manifestem,
# którego nikt nie potrafi odszyfrować, a pody czekają na Secret, który nie
# powstanie.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    # `bitnami.github.io`, nie `bitnami-labs.github.io` — kod źródłowy mieszka
    # w organizacji bitnami-labs, ale repozytorium Helma stoi pod bitnami.
    # Zły adres daje 404 na index.yaml i Application w stanie Unknown, co wygląda
    # jak problem z ArgoCD, a jest literówką w URL-u.
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    # 2.19.1 = kontroler 0.38.4, ta sama wersja co lokalny kubeseal. Rozjazd
    # major/minor między CLI a kontrolerem potrafi dać sekrety niemożliwe
    # do odszyfrowania.
    targetRevision: 2.19.1
    helm:
      releaseName: sealed-secrets
      values: |
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
