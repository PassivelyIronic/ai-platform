# Argo Rollouts — kontroler canary dla środowiska produkcyjnego (Phase 3).
# Instalowany wcześniej niż potrzebny, bo CRD Rollout musi istnieć, zanim chart
# tenanta zacznie je renderować; instalacja kontrolera nic nie kosztuje, dopóki
# żaden Rollout nie powstanie.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.38.0
    helm:
      releaseName: argo-rollouts
      values: |
        dashboard:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
