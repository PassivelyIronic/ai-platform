# ApplicationSet nad secrets/*/ — po jednym Application na tenanta.
#
# Osobno od ApplicationSetu tenantów, bo to inny rodzaj źródła: tu są gotowe
# manifesty, tam chart z plikiem values. Wrzucenie SealedSecretów do charta
# nie wchodzi w grę — są zaszyfrowane kluczem KONKRETNEGO klastra, więc nie są
# częścią przenośnej definicji serwisu.
#
# Kolejność względem ApplicationSetu tenantów nie jest gwarantowana: to dwa
# niezależne Application. Jeśli Secret pojawi się później niż StatefulSet bazy,
# pod czeka w ContainerCreating i startuje sam, gdy kontroler SealedSecrets
# odszyfruje sekret. Nie jest to więc wyścig do przegrania, tylko do przeczekania.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: https://github.com/PassivelyIronic/ai-platform.git
        revision: main
        directories:
          - path: secrets/*

  template:
    metadata:
      name: "{{.path.basename}}-secrets"
      labels:
        ai-platform.io/tenant: "{{.path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/PassivelyIronic/ai-platform.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
