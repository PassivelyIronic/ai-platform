# ApplicationSet nad secrets/<tenant>/<env>/ — po jednym Application na parę
# (tenant, środowisko).
#
# Osobno od ApplicationSetu tenantów, bo to inny rodzaj źródła: tu są gotowe
# manifesty, tam chart z plikiem values. Wrzucenie SealedSecretów do charta
# nie wchodzi w grę — są zaszyfrowane kluczem KONKRETNEGO klastra, więc nie są
# częścią przenośnej definicji serwisu.
#
# Podział na środowiska nie jest tu kosmetyką po zmianie nazw namespace'ów.
# SealedSecret jest domyślnie pieczętowany w trybie STRICT, czyli związany parą
# (nazwa, namespace): sekret zapieczętowany dla `tsl-rag-staging` nie odszyfruje
# się w `tsl-rag-prod`. Można to obejść pieczęcią `cluster-wide`, i świadomie
# tego nie robimy — sekret odszyfrowywalny w dowolnym namespace znosi izolację
# tenantów, którą budują ResourceQuota, NetworkPolicy i namespace per tenant.
#
# Efekt uboczny jest zresztą pożądany: prod ma własny klucz providera i własne
# hasło bazy, nieznane ze stagingu. Dwa komplety sekretów to stan docelowy,
# a nie podatek od podziału środowisk (D-022).
#
# Kolejność względem ApplicationSetu tenantów nie jest gwarantowana: to dwa
# niezależne Application. Jeśli Secret pojawi się później niż StatefulSet bazy,
# pod czeka w ContainerCreating i startuje sam, gdy kontroler SealedSecrets
# odszyfruje sekret. Nie jest to więc wyścig do przegrania, tylko do przeczekania.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    # Dwa poziomy zagnieżdżenia: secrets/<tenant>/<env>. Generator katalogów
    # dopasowuje pełną ścieżkę, więc katalog tenanta bez podkatalogu środowiska
    # NIE wygeneruje Application — brak sekretów zobaczysz jako pod czekający
    # w ContainerCreating, nie jako serwis wdrożony bez nich.
    - git:
        repoURL: https://github.com/PassivelyIronic/ai-platform.git
        revision: main
        directories:
          - path: secrets/*/*

  template:
    metadata:
      # segments = ["secrets", <tenant>, <env>]; basename = <env>.
      name: "{{index .path.segments 1}}-{{.path.basename}}-secrets"
      labels:
        ai-platform.io/tenant: "{{index .path.segments 1}}"
        ai-platform.io/env: "{{.path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/PassivelyIronic/ai-platform.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        # Musi zgadzać się z namespace'em wpisanym w SealedSecret przy pieczęci.
        # Rozjazd nie objawia się błędem synchronizacji — Application jest
        # Synced, a kontroler po cichu odmawia odszyfrowania.
        namespace: "{{index .path.segments 1}}-{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
