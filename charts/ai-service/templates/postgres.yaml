{{- if eq .Values.database.mode "managed" }}
{{- $db := .Values.database -}}
{{- $name := include "ai-service.name" . -}}
{{- $svc := $db.serviceName | default "postgres" -}}
---
# Sync wave 0 — baza musi istnieć, zanim ruszy restore, i długo zanim ruszy
# bramka. Bez fal bramka wystartowałaby na pustej bazie i zgłosiła regresję
# retrievalu zamiast braku danych (D-015).
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc }}
  labels:
    {{- include "ai-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  selector:
    {{- include "ai-service.databaseSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-postgres-init
  labels:
    {{- include "ai-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  # Rozszerzenie musi istnieć PRZED restore — dump tabeli go nie niesie
  # i pg_restore wywala się na `type "public.vector" does not exist`.
  # Sprawdzone, nie założone.
  00-extension.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-postgres
  labels:
    {{- include "ai-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: {{ $svc }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-service.databaseSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-service.labels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ $db.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ include "ai-service.databaseName" . | quote }}
            # Poświadczenia pochodzą z SealedSecreta dostarczonego przez tenanta.
            # Chart ich NIE generuje: `helm template` jest bezstanowy, więc
            # wygenerowane hasło byłoby inne przy każdej synchronizacji i ArgoCD
            # przepisywałby je w kółko, rozspójniając bazę z aplikacją.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "$(POSTGRES_DB)"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $db.resources | nindent 12 }}
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $db.storage }}
        {{- with $db.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
{{- end }}
