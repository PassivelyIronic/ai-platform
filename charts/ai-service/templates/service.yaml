apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-service.name" . }}
  labels:
    {{- include "ai-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    {{- include "ai-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.runtime.port | int }}
      targetPort: http
      protocol: TCP
